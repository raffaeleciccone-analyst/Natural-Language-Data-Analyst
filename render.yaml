# Blueprint di deploy per Render — l'interfaccia React servita dall'API FastAPI.
#
# Perché un file e non dei clic nella console: il deploy è configurazione, e la
# configurazione che vive solo in un pannello web non è né rivedibile né
# ripristinabile. Qui sta accanto al codice che descrive, cambia con una pull
# request e si ricrea da zero su un account nuovo.
#
# Uso: Render → New → Blueprint → scegli questo repo. Le sole cose da inserire a
# mano sono i valori marcati `sync: false` (la chiave del provider), che in un
# file versionato non devono comparire.
services:
  - type: web
    name: nlda
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: frankfurt        # il più vicino a un pubblico europeo
    healthCheckPath: /api/health
    # Nota: il Dockerfile accetta `--build-arg EXTRAS=openai,api` per installare
    # il solo SDK che il deploy usa, ma i Blueprint di Render NON sanno passare
    # build argument — non esiste un campo per farlo, né qui né nella console. Si
    # usa quindi il default del Dockerfile (`all,api`), che installa gli SDK di
    # tutti i provider.
    #
    # Costa qualche minuto di build in più e nulla a runtime: l'import di ogni SDK
    # avviene solo quando quel provider viene scelto, e i 99 MB a riposo misurati
    # sull'immagine sono già quelli con questo default.
    envVars:
      # --- Demo pubblica: il tetto di spesa ---
      # Senza questi, l'API risponde a chiunque usando la chiave qui sotto, e a
      # pagare è il manutentore. La quota vive in `nlda/api/quota.py`.
      - key: DEMO_MODE
        value: "true"
      - key: DEMO_MAX_QUESTIONS   # per visitatore (identificato dall'IP)
        value: "15"
      - key: DEMO_MAX_DAILY       # su tutti i visitatori: è il tetto vero
        value: "200"

      # --- Provider LLM ---
      - key: PROVIDER
        value: groq
      - key: MODEL
        value: llama-3.3-70b-versatile
      # Da inserire nella console di Render, mai qui: un file versionato è
      # pubblico quanto il repo.
      - key: GROQ_API_KEY
        sync: false

      # --- Sandbox: fail-closed ---
      # Se il sottoprocesso non è avviabile l'esecuzione si BLOCCA invece di
      # ripiegare in-process, che non ha né timeout né tetto di memoria. È la
      # scelta giusta ovunque, ed è obbligatoria dove si esegue codice generato
      # da un modello per conto di sconosciuti.
      - key: ALLOW_INPROCESS_FALLBACK
        value: "false"

      # --- Log ---
      # Una riga JSON per evento, con turn_id, latenza, token e costo stimato:
      # è la forma che `scripts/analyze_logs.py` sa riepilogare.
      - key: LOG_FORMAT
        value: json

      # ATTENZIONE al significato: `RLIMIT_AS` limita lo spazio di INDIRIZZAMENTO,
      # non la memoria occupata. Qui c'era 256, scelto ragionando sui ~130 MB che
      # l'immagine occupa davvero — ed era sbagliato: pandas e numpy riservano
      # molto piu' spazio virtuale di quanto usino, e sotto 1 GB il worker moriva
      # prima ancora di eseguire `len(df)`. Ogni domanda falliva con "possibile
      # esaurimento memoria".
      #
      # 1500 e' il default del progetto. Il contenimento reale su questo piano lo
      # danno i 512 MB del container, che Render applica dall'esterno.
      - key: MEMORY_LIMIT_MB
        value: "1500"

      # Il piano gratuito da' 0,1 vCPU condivisa: l'avvio del worker della
      # sandbox — un interprete che importa pandas e plotly — richiede li' molto
      # piu' dei 2 secondi misurati in locale, e quel tempo rientra nel budget di
      # EXEC_TIMEOUT. Col default di 12 s andava in timeout persino `len(df)`,
      # cioe' un calcolo che non calcola nulla: l'utente leggeva "codice troppo
      # lento" per un'attesa che il suo codice non aveva causato.
      #
      # 60 s e' generoso di proposito: la spesa vera la limita la quota
      # giornaliera, non questo timeout, e un errore su una domanda legittima
      # costa piu' di un'attesa lunga su una patologica.
      - key: EXEC_TIMEOUT
        value: "60"
