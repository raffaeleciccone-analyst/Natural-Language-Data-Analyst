version: 2

# Le dipendenze dell'app sono pinnate al '==' per riproducibilità: senza un
# aggiornamento automatico resterebbero ferme finché qualcuno non se ne ricorda,
# ed è esattamente così che un progetto accumula vulnerabilità note.
# Dependabot apre una PR, la CI la verifica (test su 3.12/3.13/3.14, pip-audit,
# bandit): l'aggiornamento resta una scelta, ma diventa una scelta informata.
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(ci)"

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(docker)"
    # I major di Node si saltano di proposito: solo quelli PARI diventano LTS, e
    # l'immagine serve al solo stage di build del frontend, dove una linea con
    # supporto lungo vale più di una versione recente. La CI compila il frontend
    # con Node 24 (`ci.yml`): seguire un major dispari qui farebbe compilare lo
    # stesso artefatto con due versioni diverse. Si salirà al prossimo LTS
    # cambiando questa riga a mano — una decisione, non un automatismo.
    # Le patch e le minor del tag `24-slim` continuano ad arrivare: è lì che
    # stanno le correzioni di sicurezza.
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
