name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  quality:
    name: Lint, type-check e test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installa le dipendenze (app + dev)
        run: |
          python -m pip install --upgrade pip
          # requirements.txt per primo: fissa le versioni esatte con cui il
          # type-check è riproducibile (gli stub dipendono dalla release di numpy).
          pip install -r requirements.txt
          # Il progetto in editable + gli strumenti di sviluppo, da pyproject.
          pip install -e ".[dev]"

      - name: Ruff (lint)
        run: ruff check .

      - name: Mypy (type-check)
        run: mypy core main.py

      - name: Pytest
        run: pytest
