name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  # I test girano su OGNI versione supportata: `requires-python` è una promessa,
  # e una promessa non verificata prima o poi è falsa.
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false        # un fallimento su 3.14 non deve nascondere 3.12
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Installa le dipendenze (app + tutti gli SDK + API + dev)
        run: |
          python -m pip install --upgrade pip
          # requirements.txt per primo: fissa le versioni esatte con cui il
          # type-check è riproducibile (gli stub dipendono dalla release di numpy).
          # NB: è il manifest di Streamlit Community Cloud, che l'API non la serve:
          # FastAPI arriva dall'extra `api` qui sotto, non da lì.
          pip install -r requirements.txt
          # `all` (non solo `dev`): i test di contratto sui provider verificano gli
          # argomenti passati contro la firma REALE dell'SDK installato. Senza
          # anthropic/google-genai/ollama quei test si salterebbero in silenzio,
          # cioè proprio dove servono: a intercettare un major che cambia firma.
          #
          # `api`: senza, i test dell'API non venivano saltati — fallivano in
          # RACCOLTA, e con loro l'intera suite. È l'unico extra che i test
          # importano direttamente, quindi l'unico che non può mancare.
          pip install -e ".[all,api,dev]"

      # Soglia di copertura sotto il valore misurato (81% su `nlda`): deve
      # segnalare una REGRESSIONE, non essere un obiettivo aspirazionale che
      # fallisce subito e viene disattivato al primo fastidio. Si alza quando la
      # copertura sale in modo stabile.
      #
      # main.py resta FUORI dal gate: è lo script Streamlit (esegue la UI al solo
      # import, quindi nessun test lo importa) e la sua copertura è di fatto 0%.
      # Includerlo abbasserebbe la soglia per tutti gli altri moduli, cioè
      # renderebbe il gate cieco proprio sul codice che i test coprono davvero.
      - name: Pytest (con soglia di copertura)
        run: pytest --cov=nlda --cov-report=term-missing --cov-fail-under=78

  # Lint e type-check su una sola versione: non dipendono dall'interprete e
  # ripeterli tre volte allungherebbe la CI senza aggiungere informazione.
  quality:
    name: Lint e type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Installa le dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Anche qui `all`: con gli SDK installati mypy vede i loro tipi reali e
          # controlla davvero il codice dei provider, invece di lasciarlo cadere
          # sotto `ignore_missing_imports`. Verificato in locale che il
          # type-check resta pulito con tutti e quattro gli SDK presenti.
          #
          # E `api` per lo stesso motivo, con un effetto meno ovvio: senza
          # FastAPI, `APIRouter` diventa `Any`, il `type: ignore` che serve con i
          # tipi veri risulta superfluo e mypy fallisce su `unused-ignore`. Il
          # type-check senza le dipendenze non è più permissivo: è diverso.
          pip install -e ".[all,api,dev]"

      - name: Ruff (lint)
        run: ruff check .

      - name: Mypy (type-check)
        run: mypy nlda main.py

  # L'immagine è parte del prodotto, non un extra: in container gira il deploy
  # con i limiti di sistema attivi. Senza questo job un aggiornamento della base
  # image (dependabot ne apre uno appena esce una nuova release di python:slim)
  # passerebbe con la spunta verde senza che nessuno abbia mai provato a
  # costruirla: il resto della CI non tocca mai il Dockerfile.
  docker:
    name: Immagine Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true              # resta locale al runner: non si pubblica nulla
          tags: nlda:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: L'app parte e si dichiara sana
        run: |
          docker run -d --name nlda-ci nlda:ci
          # Si attende il verdetto dell'HEALTHCHECK dell'immagine invece di
          # interrogare la porta a mano: è lo stesso segnale che userebbe un
          # orchestratore, quindi si verifica ciò che conta in produzione.
          for _ in $(seq 1 40); do
            status=$(docker inspect --format='{{.State.Health.Status}}' nlda-ci)
            [ "$status" != "starting" ] && break
            sleep 3
          done
          echo "HEALTHCHECK: $status"
          [ "$status" = "healthy" ]

      - name: L'immagine serve ANCHE il frontend compilato
        run: |
          # Il frontend viene costruito dentro l'immagine (stage Node): se il
          # build fallisse o `dist/` finisse nel posto sbagliato, l'API
          # risponderebbe lo stesso e il difetto si vedrebbe solo aprendo il
          # browser. Qui si controlla che la radice serva davvero la pagina.
          docker exec nlda-ci python -c "
          import urllib.request
          html = urllib.request.urlopen('http://localhost:8000/', timeout=5).read().decode()
          assert '<div id=\"root\"' in html, 'la radice non serve il frontend'
          assert '/assets/' in html, 'la pagina non referenzia il bundle compilato'
          print('frontend servito dal container')
          "

      - name: "\"Chiedi al progetto\" trova la documentazione"
        run: |
          # Le fonti sono file .md del repo, e una fonte assente NON e' fatale:
          # l'app risponde con quello che ha. Ottima scelta, con un effetto
          # collaterale — se il Dockerfile smette di copiarli, la funzione muore
          # in silenzio e risponde "non trovo nulla" a qualunque domanda.
          docker exec nlda-ci python -c "
          from nlda.project_qa import base_di_conoscenza, cerca
          frammenti = base_di_conoscenza()
          assert len(frammenti) > 50, f'base di conoscenza quasi vuota: {len(frammenti)} frammenti'
          assert cerca('Come funziona la sandbox di sicurezza?'), 'nessun risultato per una domanda nota'
          print(f'base di conoscenza: {len(frammenti)} frammenti')
          "

      - name: La sandbox funziona dentro il container
        run: |
          docker exec nlda-ci python -c "
          import pandas as pd
          from nlda.sandbox import execute_pandas_code
          from nlda.results import ExecutionSuccess, ExecutionFailure
          df = pd.DataFrame({'a': [1.0, 2.0]})
          ok = execute_pandas_code(\"df['a'].sum()\", df)
          ko = execute_pandas_code(\"df.to_csv('/tmp/x.csv')\", df)
          assert isinstance(ok, ExecutionSuccess) and ok.value == 3.0, ok
          assert isinstance(ko, ExecutionFailure) and ko.kind == 'security', ko
          print('sandbox ok nel container')
          "

      # I controlli sopra avviano il container coi DEFAULT del codice. Il deploy
      # invece gira con le variabili di `render.yaml`, che finora non leggeva
      # nessuno: `MEMORY_LIMIT_MB=256` scritto li' faceva morire il worker della
      # sandbox prima ancora di importare pandas, e ogni domanda della demo
      # falliva mentre qui era tutto verde perche' valeva il default (1500).
      #
      # Il difetto non era nel codice, era in un file che nessun controllo
      # apriva. Ora si apre.
      - name: La configurazione del DEPLOY regge una domanda vera
        run: |
          pip install --quiet pyyaml
          python scripts/env_da_blueprint.py > /tmp/deploy.env
          echo "Variabili prese da render.yaml:"; cat /tmp/deploy.env

          docker run -d --name nlda-deploy --env-file /tmp/deploy.env nlda:ci
          for _ in $(seq 1 40); do
            stato=$(docker inspect --format='{{.State.Health.Status}}' nlda-deploy)
            [ "$stato" != "starting" ] && break
            sleep 3
          done
          echo "HEALTHCHECK: $stato"
          [ "$stato" = "healthy" ]

          # Una domanda che passa DAVVERO per la sandbox, non un import: e' il
          # percorso che si rompeva.
          docker exec nlda-deploy python -c "
          from nlda.loader import load_dataset
          from nlda.results import ExecutionSuccess
          from nlda.sandbox import execute_pandas_code
          df = load_dataset('sales.csv')
          esito = execute_pandas_code(\"result = df.groupby('Region')['Sales'].sum()\", df)
          assert isinstance(esito, ExecutionSuccess), esito
          print('la sandbox lavora con la configurazione del deploy')
          "

      - name: Log dei container se qualcosa è fallito
        if: failure()
        run: |
          docker logs nlda-ci || true
          docker logs nlda-deploy || true

  frontend:
    name: Frontend (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installa le dipendenze
        working-directory: frontend
        run: npm ci

      - name: Type-check, lint e build
        working-directory: frontend
        run: |
          # `npm run typecheck` = `tsc -b --noEmit`, NON `tsc --noEmit`: il
          # tsconfig di Vite ha "files": [] e solo dei riferimenti, quindi la
          # seconda forma esce con successo senza controllare un solo file.
          # Sembra un controllo e non lo e'.
          npm run typecheck
          npx oxlint src
          # I test dell'interfaccia. Il frontend e' rimasto a lungo senza: i
          # difetti piu' visibili di questo progetto — la barra laterale che
          # riduceva il contenuto a 88 px, i KPI tagliati, la sintesi chiesta
          # con le colonne del dataset precedente — erano tutti qui, e la suite
          # Python era verde mentre succedevano.
          npm test
          npm run build

      - name: Nessuna vulnerabilita' nelle dipendenze
        working-directory: frontend
        run: npm audit --audit-level=high

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: I tipi TypeScript descrivono l'API di ADESSO
        run: |
          # Il file dei tipi e' generato e committato: puo' andare fuori sincrono
          # con i modelli Pydantic senza che nessuno se ne accorga finche' non
          # compila qualcuno. Qui si confronta con lo schema attuale.
          pip install -e ".[api]"
          python scripts/genera_tipi_ts.py --verifica

  # Il progetto esegue codice generato da un LLM: una CI che non guarda mai la
  # sicurezza sarebbe una contraddizione con la sua stessa ragione d'essere.
  security:
    name: Sicurezza (dipendenze e codice)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Installa gli strumenti
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit bandit

      # Vulnerabilità note nelle dipendenze dichiarate.
      - name: pip-audit (dipendenze)
        run: pip-audit -r requirements.txt --strict

      # Analisi statica di sicurezza sul codice. Le costruzioni pericolose ma
      # deliberate (eval/exec della sandbox, pickle verso il worker, subprocess)
      # sono annotate con `# nosec` e una motivazione nel punto d'uso: qui non
      # ci sono soppressioni globali, quindi una NUOVA occorrenza fa fallire il job.
      - name: bandit (codice)
        run: bandit -r nlda main.py
