name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  # I test girano su OGNI versione supportata: `requires-python` è una promessa,
  # e una promessa non verificata prima o poi è falsa.
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false        # un fallimento su 3.14 non deve nascondere 3.12
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Installa le dipendenze (app + tutti gli SDK + dev)
        run: |
          python -m pip install --upgrade pip
          # requirements.txt per primo: fissa le versioni esatte con cui il
          # type-check è riproducibile (gli stub dipendono dalla release di numpy).
          pip install -r requirements.txt
          # `all` (non solo `dev`): i test di contratto sui provider verificano gli
          # argomenti passati contro la firma REALE dell'SDK installato. Senza
          # anthropic/google-genai/ollama quei test si salterebbero in silenzio,
          # cioè proprio dove servono: a intercettare un major che cambia firma.
          pip install -e ".[all,dev]"

      # Soglia di copertura sotto il valore misurato (81% su `nlda`): deve
      # segnalare una REGRESSIONE, non essere un obiettivo aspirazionale che
      # fallisce subito e viene disattivato al primo fastidio. Si alza quando la
      # copertura sale in modo stabile.
      #
      # main.py resta FUORI dal gate: è lo script Streamlit (esegue la UI al solo
      # import, quindi nessun test lo importa) e la sua copertura è di fatto 0%.
      # Includerlo abbasserebbe la soglia per tutti gli altri moduli, cioè
      # renderebbe il gate cieco proprio sul codice che i test coprono davvero.
      - name: Pytest (con soglia di copertura)
        run: pytest --cov=nlda --cov-report=term-missing --cov-fail-under=78

  # Lint e type-check su una sola versione: non dipendono dall'interprete e
  # ripeterli tre volte allungherebbe la CI senza aggiungere informazione.
  quality:
    name: Lint e type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Installa le dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Anche qui `all`: con gli SDK installati mypy vede i loro tipi reali e
          # controlla davvero il codice dei provider, invece di lasciarlo cadere
          # sotto `ignore_missing_imports`. Verificato in locale che il
          # type-check resta pulito con tutti e quattro gli SDK presenti.
          pip install -e ".[all,dev]"

      - name: Ruff (lint)
        run: ruff check .

      - name: Mypy (type-check)
        run: mypy nlda main.py

  # L'immagine è parte del prodotto, non un extra: in container gira il deploy
  # con i limiti di sistema attivi. Senza questo job un aggiornamento della base
  # image (dependabot ne apre uno appena esce una nuova release di python:slim)
  # passerebbe con la spunta verde senza che nessuno abbia mai provato a
  # costruirla: il resto della CI non tocca mai il Dockerfile.
  docker:
    name: Immagine Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true              # resta locale al runner: non si pubblica nulla
          tags: nlda:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: L'app parte e si dichiara sana
        run: |
          docker run -d --name nlda-ci nlda:ci
          # Si attende il verdetto dell'HEALTHCHECK dell'immagine invece di
          # interrogare la porta a mano: è lo stesso segnale che userebbe un
          # orchestratore, quindi si verifica ciò che conta in produzione.
          for _ in $(seq 1 40); do
            status=$(docker inspect --format='{{.State.Health.Status}}' nlda-ci)
            [ "$status" != "starting" ] && break
            sleep 3
          done
          echo "HEALTHCHECK: $status"
          [ "$status" = "healthy" ]

      - name: La sandbox funziona dentro il container
        run: |
          docker exec nlda-ci python -c "
          import pandas as pd
          from nlda.sandbox import execute_pandas_code
          from nlda.results import ExecutionSuccess, ExecutionFailure
          df = pd.DataFrame({'a': [1.0, 2.0]})
          ok = execute_pandas_code(\"df['a'].sum()\", df)
          ko = execute_pandas_code(\"df.to_csv('/tmp/x.csv')\", df)
          assert isinstance(ok, ExecutionSuccess) and ok.value == 3.0, ok
          assert isinstance(ko, ExecutionFailure) and ko.kind == 'security', ko
          print('sandbox ok nel container')
          "

      - name: Log del container se qualcosa è fallito
        if: failure()
        run: docker logs nlda-ci

  # Il progetto esegue codice generato da un LLM: una CI che non guarda mai la
  # sicurezza sarebbe una contraddizione con la sua stessa ragione d'essere.
  security:
    name: Sicurezza (dipendenze e codice)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Installa gli strumenti
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit bandit

      # Vulnerabilità note nelle dipendenze dichiarate.
      - name: pip-audit (dipendenze)
        run: pip-audit -r requirements.txt --strict

      # Analisi statica di sicurezza sul codice. Le costruzioni pericolose ma
      # deliberate (eval/exec della sandbox, pickle verso il worker, subprocess)
      # sono annotate con `# nosec` e una motivazione nel punto d'uso: qui non
      # ci sono soppressioni globali, quindi una NUOVA occorrenza fa fallire il job.
      - name: bandit (codice)
        run: bandit -r nlda main.py
