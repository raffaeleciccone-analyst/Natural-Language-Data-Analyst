<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="660" viewBox="0 0 1040 660" font-family="'IBM Plex Sans','Segoe UI',system-ui,sans-serif">
  <rect width="1040" height="660" fill="#f2f4f6"/>

  <!-- Sidebar (rail scuro) -->
  <rect x="0" y="0" width="230" height="660" fill="#191d23"/>
  <rect x="229" y="0" width="1" height="660" fill="#2b323b"/>
  <rect x="24" y="26" width="32" height="32" rx="8" fill="#0d8a7d"/>
  <path d="M32 48 V34 M32 48 h16 M38 44 v-6 M44 44 v-9" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round"/>
  <text x="66" y="40" font-size="15" font-weight="700" fill="#ffffff">Data Analyst</text>
  <text x="66" y="55" font-size="10" font-family="monospace" fill="#8a95a1">CONSOLE</text>
  <text x="24" y="104" font-size="10" font-family="monospace" letter-spacing="1" fill="#8a95a1">PROVIDER</text>
  <rect x="24" y="112" width="182" height="34" rx="9" fill="#20262e" stroke="#2b323b"/>
  <text x="38" y="134" font-size="12.5" fill="#d6dde4">Groq</text>
  <text x="24" y="172" font-size="10" font-family="monospace" letter-spacing="1" fill="#8a95a1">MODELLO</text>
  <rect x="24" y="180" width="182" height="34" rx="9" fill="#20262e" stroke="#2b323b"/>
  <text x="38" y="201" font-size="11" font-family="monospace" fill="#d6dde4">llama-3.3-70b</text>
  <text x="24" y="248" font-size="10" font-family="monospace" letter-spacing="1" fill="#8a95a1">REPORT</text>
  <rect x="24" y="256" width="182" height="30" rx="9" fill="#20262e" stroke="#2b323b"/>
  <text x="38" y="275" font-size="11.5" fill="#d6dde4">Misura · Sales</text>
  <rect x="24" y="292" width="182" height="30" rx="9" fill="#20262e" stroke="#2b323b"/>
  <text x="38" y="311" font-size="11.5" fill="#d6dde4">Categoria · Region</text>
  <rect x="24" y="352" width="182" height="66" rx="11" fill="#20262e" stroke="#2b323b" stroke-dasharray="4 4"/>
  <text x="115" y="380" font-size="12" fill="#8a95a1" text-anchor="middle">Trascina un file</text>
  <text x="115" y="398" font-size="12" font-weight="600" fill="#3ba594" text-anchor="middle">CSV · Excel · JSON</text>

  <!-- Topbar -->
  <text x="266" y="42" font-size="24" font-weight="700" fill="#1b1f24">Natural Language Data Analyst</text>
  <text x="266" y="64" font-size="12" font-family="monospace" fill="#586471">provider attivo: <tspan fill="#1b1f24" font-weight="600">groq</tspan> · <tspan fill="#0a6b61">llama-3.3-70b-versatile</tspan></text>
  <text x="266" y="88" font-size="11.5" font-family="monospace" fill="#8b97a3">Dataset di default (Superstore Sales) — 9.800 righe · 18 colonne</text>

  <!-- KPI readouts (tacca teal solo sul Totale, neutre le altre) -->
  <g>
    <rect x="266" y="106" width="178" height="92" rx="12" fill="#ffffff" stroke="#e4e8ec"/>
    <text x="284" y="132" font-size="10" font-family="monospace" fill="#586471">TOTALE SALES</text>
    <text x="284" y="164" font-size="20" font-family="monospace" font-weight="600" fill="#1b1f24">2.261.537 $</text>
    <rect x="284" y="178" width="34" height="3" rx="2" fill="#0d8a7d"/>
  </g>
  <g>
    <rect x="458" y="106" width="178" height="92" rx="12" fill="#ffffff" stroke="#e4e8ec"/>
    <text x="476" y="132" font-size="10" font-family="monospace" fill="#586471">MEDIA SALES</text>
    <text x="476" y="164" font-size="20" font-family="monospace" font-weight="600" fill="#1b1f24">230,77 $</text>
    <rect x="476" y="178" width="34" height="3" rx="2" fill="#c8d0d8"/>
  </g>
  <g>
    <rect x="650" y="106" width="178" height="92" rx="12" fill="#ffffff" stroke="#e4e8ec"/>
    <text x="668" y="132" font-size="10" font-family="monospace" fill="#586471">MASSIMO SALES</text>
    <text x="668" y="164" font-size="20" font-family="monospace" font-weight="600" fill="#1b1f24">22.638 $</text>
    <rect x="668" y="178" width="34" height="3" rx="2" fill="#c8d0d8"/>
  </g>
  <g>
    <rect x="842" y="106" width="174" height="92" rx="12" fill="#ffffff" stroke="#e4e8ec"/>
    <text x="860" y="132" font-size="10" font-family="monospace" fill="#586471">TOP REGION</text>
    <text x="860" y="160" font-size="18" font-family="monospace" font-weight="600" fill="#1b1f24">West</text>
    <text x="860" y="178" font-size="10.5" font-family="monospace" fill="#8b97a3">710.220 $</text>
    <rect x="860" y="186" width="34" height="3" rx="2" fill="#c8d0d8"/>
  </g>

  <!-- Riga di misura (la "firma") -->
  <rect x="266" y="216" width="750" height="8" fill="url(#scale)"/>
  <defs>
    <pattern id="scale" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="1" height="8" fill="#d5dbe1"/>
    </pattern>
  </defs>

  <!-- ===== Colonna sinistra: REPORT ===== -->
  <text x="266" y="252" font-size="17" font-weight="700" fill="#1b1f24">Report iniziale sui dati</text>

  <!-- Sintesi card (superficie fredda, niente bordo colorato) -->
  <rect x="266" y="266" width="452" height="104" rx="12" fill="#f7f9fb" stroke="#e4e8ec"/>
  <text x="286" y="292" font-size="10.5" font-family="monospace" letter-spacing="1" font-weight="600" fill="#0a6b61">SINTESI DEI DATI</text>
  <text x="286" y="316" font-size="12.5" fill="#1b1f24">Il dataset raccoglie 9.800 ordini. Le Sales totali valgono</text>
  <text x="286" y="335" font-size="12.5" fill="#1b1f24">2.261.537 $, media 230,77 $. La regione West guida con</text>
  <text x="286" y="354" font-size="12.5" fill="#1b1f24">710.220 $; picco mensile novembre 2018 (117.938 $).</text>

  <!-- Chart card: Classifica per Region (barre teal) -->
  <rect x="266" y="384" width="452" height="252" rx="12" fill="#ffffff" stroke="#e4e8ec"/>
  <text x="286" y="412" font-size="13.5" font-weight="700" fill="#1b1f24">Classifica: Sales per Region</text>
  <line x1="300" y1="444" x2="700" y2="444" stroke="#e4e8ec"/>
  <line x1="300" y1="492" x2="700" y2="492" stroke="#e4e8ec"/>
  <line x1="300" y1="540" x2="700" y2="540" stroke="#e4e8ec"/>
  <line x1="300" y1="600" x2="700" y2="600" stroke="#d5dbe1"/>
  <rect x="330" y="452" width="56" height="148" rx="4" fill="#0d8a7d"/>
  <rect x="420" y="460" width="56" height="140" rx="4" fill="#0d8a7d"/>
  <rect x="510" y="500" width="56" height="100" rx="4" fill="#0d8a7d"/>
  <rect x="600" y="518" width="56" height="82"  rx="4" fill="#0d8a7d"/>
  <g font-family="monospace" font-size="10.5" fill="#1b1f24" text-anchor="middle">
    <text x="358" y="446">710k</text><text x="448" y="454">669k</text>
    <text x="538" y="494">493k</text><text x="628" y="512">389k</text>
  </g>
  <g font-family="monospace" font-size="10.5" fill="#586471" text-anchor="middle">
    <text x="358" y="618">West</text><text x="448" y="618">East</text>
    <text x="538" y="618">Central</text><text x="628" y="618">South</text>
  </g>

  <!-- ===== Colonna destra: CHAT ===== -->
  <text x="740" y="252" font-size="17" font-weight="700" fill="#1b1f24">Fai una domanda ai tuoi dati</text>
  <rect x="740" y="266" width="276" height="40" rx="10" fill="#ffffff" stroke="#d5dbe1"/>
  <text x="756" y="291" font-size="12" fill="#8b97a3">Es. "Qual è il mese con più vendite?"</text>
  <rect x="740" y="314" width="276" height="40" rx="10" fill="#0d8a7d"/>
  <text x="878" y="339" font-size="13.5" font-weight="600" fill="#ffffff" text-anchor="middle">Invia</text>
  <text x="740" y="378" font-size="11.5" fill="#8b97a3">Non sai da dove iniziare? Prova una di queste</text>
  <rect x="740" y="390" width="276" height="34" rx="9" fill="#f7f9fb" stroke="#e4e8ec"/>
  <text x="878" y="411" font-size="12" fill="#1b1f24" text-anchor="middle">Mostrami Sales per Region</text>
  <rect x="740" y="430" width="276" height="34" rx="9" fill="#f7f9fb" stroke="#e4e8ec"/>
  <text x="878" y="451" font-size="12" fill="#1b1f24" text-anchor="middle">Quali sono i 5 Region con più Sales?</text>
  <rect x="740" y="470" width="276" height="34" rx="9" fill="#f7f9fb" stroke="#e4e8ec"/>
  <text x="878" y="491" font-size="12" fill="#1b1f24" text-anchor="middle">Qual è il totale di Sales?</text>
</svg>
