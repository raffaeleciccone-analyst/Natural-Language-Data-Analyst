[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "natural-language-data-analyst"
# La versione sta in `nlda/__init__.py` ed è letta da lì: era ricopiata anche
# nell'API, e due copie di un numero che deve cambiare insieme prima o poi
# divergono.
dynamic = ["version"]
description = "Interroga i tuoi dati in linguaggio naturale: l'LLM racconta, Pandas calcola."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"

# Dipendenze necessarie a far girare l'app. Pinnate alle versioni testate: la
# riproducibilità vale più dell'aggiornamento automatico, e numpy in particolare
# determina gli stub di tipo con cui gira il type-check in CI.
dependencies = [
    "streamlit==1.60.0",
    "pandas==3.0.5",
    "numpy==2.5.1",
    "plotly==6.9.0",
    "openpyxl==3.1.5",   # lettura file Excel (.xlsx)
]

# Gli SDK dei provider sono OPZIONALI: si installa solo quello che si usa.
# L'import è lazy (dentro `_call`), quindi l'app parte anche senza gli altri.
[project.optional-dependencies]
ollama = ["ollama==0.6.2"]                # modelli locali, nessuna API key
anthropic = ["anthropic>=0.40,<2.0"]
openai = ["openai>=1.40,<3.0"]            # copre anche Groq: API compatibile
gemini = ["google-genai>=0.3,<3.0"]
all = [
    "natural-language-data-analyst[ollama,anthropic,openai,gemini]",
]
# L'API HTTP e' OPZIONALE come i provider: chi usa solo l'app Streamlit non deve
# installare FastAPI. Il frontend React parla con questa, non con Streamlit.
api = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",   # richiesto da FastAPI per l'upload di file
]
# Strumenti di sviluppo: test, lint, type-check.
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",   # copertura misurata, con soglia applicata in CI
    "hypothesis>=6.0",   # property/fuzz test sul validatore della sandbox (#16)
    "httpx>=0.27",       # TestClient di FastAPI: i test dell'API non aprono socket
    "ruff>=0.6",
    "mypy>=1.11",
    # Nota: 'pandas-stubs' NON è incluso di proposito. Le sue release seguono
    # pandas 2.x mentre qui usiamo pandas 3.0: gli stub disallineati producevano
    # decine di falsi positivi in mypy. Finché non esiste una versione per
    # pandas 3.x, pandas resta senza stub (il type-check resta attivo sul resto).
]
# Script accessori non necessari all'app (vedi scripts/).
tools = ["pillow>=10.0", "scipy>=1.11"]

[project.urls]
Repository = "https://github.com/raffaeleciccone-analyst/Natural-Language-Data-Analyst"

# Il pacchetto importabile è `nlda`; il resto del repo (app, test, dati) non fa
# parte della distribuzione. Il nome non è generico di proposito: una libreria
# installata non deve occupare un namespace comune come `core`.
[tool.hatch.version]
path = "nlda/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["nlda"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
# E/W: stile (pycodestyle), F: errori reali (pyflakes), I: ordine import,
# B: bug comuni (bugbear), UP: modernizzazioni sintassi.
select = ["E", "W", "F", "I", "B", "UP"]
# E501 (riga troppo lunga) è gestita dal formatter; qui non blocchiamo la CI su
# commenti leggermente lunghi.
ignore = ["E501"]

[tool.mypy]
# Target 3.12: è il minimo supportato (vedi requires-python) e la versione su cui
# gira il type-check. Vincolo aggiuntivo: gli stub di numpy 2.5 usano la sintassi
# 'type X = ...' (PEP 695), che mypy sa parsare solo con python_version >= 3.12.
python_version = "3.12"
ignore_missing_imports = true   # gli SDK dei provider sono opzionali e senza stub
warn_unused_ignores = true
warn_redundant_casts = true
# Adozione graduale: non pretendiamo l'annotazione completa su tutto il codice
# esistente. Il valore è intercettare gli errori di tipo evidenti.
check_untyped_defs = true
# Bersagli di default: senza questi `mypy` nudo esce con "Missing target module"
# e il type-check gira solo dove qualcuno ricorda di elencarli. Sono gli stessi
# della CI (`mypy nlda main.py`); gli argomenti da riga di comando li scavalcano.
files = ["nlda", "main.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
